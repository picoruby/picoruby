name: C/C++ CI

on:
  push:
    branches:
      - master
      - ci-test
  pull_request:
    branches:
      - master

env:
  GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
  # The CRuby every job runs the build tools on. Change it here only.
  RUBY_VERSION: '4.0.7'

permissions:
  contents: write
  pull-requests: write

jobs:

  test-steep:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

    - name: Checkout recursive
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ env.RUBY_VERSION }}
        bundler-cache: true

    - name: Test Steep
      run: rake test:gems:steep

  test-picoruby:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

    - name: Checkout recursive
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ env.RUBY_VERSION }}
        bundler-cache: true

    - name: Test PicoRuby
      run: rake test:gems:picoruby

  test-picoruby-aot:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

    - name: Checkout recursive
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ env.RUBY_VERSION }}
        bundler-cache: true

    - name: Spinel commit
      id: spinel
      run: echo "sha=$(git -C mrbgems/picoruby-aot/lib/spinel rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # The vendored parsers `make deps` fetches from rubygems.org, once per
    # Spinel commit. The build itself is not cached: a checkout gives every
    # source a new mtime, so make would rebuild anyway.
    - name: Cache the Spinel parsers
      uses: actions/cache@v4
      with:
        path: mrbgems/picoruby-aot/lib/spinel/vendor
        key: spinel-vendor-${{ steps.spinel.outputs.sha }}

    # Every gem test:gems:picoruby runs, each compiled with picoruby-aot.
    - name: Test PicoRuby AOT twin (irep, AOT, AOT with widened defs)
      run: rake test:gems:aot_twin

  # The same twin on the 32-bit host build (MRB_INT32, word boxing,
  # mruby-bigint): where a compiled method meets a Bignum.
  test-picoruby-aot32:

    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

    - name: Checkout recursive
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ env.RUBY_VERSION }}
        bundler-cache: true

    - name: Setup 32-bit toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib

    - name: Spinel commit
      id: spinel
      run: echo "sha=$(git -C mrbgems/picoruby-aot/lib/spinel rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Cache the Spinel parsers
      uses: actions/cache@v4
      with:
        path: mrbgems/picoruby-aot/lib/spinel/vendor
        key: spinel-vendor-${{ steps.spinel.outputs.sha }}

    - name: Test PicoRuby AOT twin on the 32-bit build
      run: rake test:gems:aot_twin32

  test-picoruby32:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

    - name: Checkout recursive
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ env.RUBY_VERSION }}
        bundler-cache: true

    - name: Setup 32-bit toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib

    - name: Test PicoRuby (32-bit, MRB_INT32 + word boxing)
      run: rake test:gems:picoruby32

  test-femtoruby:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

    - name: Checkout recursive
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ env.RUBY_VERSION }}
        bundler-cache: true

    - name: Test FemtoRuby
      run: rake test:gems:femtoruby

  test-wasm:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

    - name: Checkout recursive
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ env.RUBY_VERSION }}
        bundler-cache: true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: '6.0.12'

    - name: Test WASM
      run: rake test:gems:wasm
